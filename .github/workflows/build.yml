name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Simulplay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Simulplay
          path: Simulplay.apk

      - name: Publicar download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Simulplay ${{ github.run_number }}
          files: Simulplay.apk
          make_latest: true
