<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  var player = null, apiReady = false, pendingId = null;
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    apiReady = true;
    if (pendingId) { var id = pendingId; pendingId = null; load(id); }
  }

  // pré-carrega: toca sem som até o vídeo começar de verdade, pausa e volta pro começo.
  // Assim, na hora de tocar junto, o vídeo já está carregado e não trava.
  var priming = false, primeTimer = null;
  function prime() {
    if (!player || !player.playVideo) return;
    priming = true;
    try { player.mute(); player.playVideo(); } catch (e) {}
    clearTimeout(primeTimer);
    primeTimer = setTimeout(function () { if (priming) finishPrime(); }, 10000);
  }
  function finishPrime() {
    priming = false;
    clearTimeout(primeTimer);
    try { player.pauseVideo(); player.seekTo(0, true); } catch (e) {}
    applyVol();
    try { Android.onPrimed(); } catch (e) {}
    report();
  }

  function load(id) {
    if (!apiReady) { pendingId = id; return; }
    if (player && player.cueVideoById) { priming = false; player.cueVideoById(id); setTimeout(prime, 300); return; }
    player = new YT.Player('p', {
      width: '100%', height: '100%', videoId: id,
      playerVars: {
        autoplay: 0, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1,
        iv_load_policy: 3, modestbranding: 1, origin: location.origin
      },
      events: {
        onReady: function () {
          try { Android.onRates(JSON.stringify(player.getAvailablePlaybackRates())); } catch (e) {}
          applyVol();
          report();
          prime();
        },
        onStateChange: function (e) {
          if (priming && e.data === 1) { finishPrime(); return; }
          report();
        },
        onError: function (e) { Android.onError(String(e.data)); }
      }
    });
  }

  function report() {
    if (!player || !player.getCurrentTime || priming) return;
    Android.onState(player.getPlayerState(), player.getCurrentTime() * 1000, player.getDuration() * 1000);
  }
  setInterval(report, 100);

  function play() { if (priming) { priming = false; applyVol(); } if (player && player.playVideo) player.playVideo(); }
  function pause() { if (player && player.pauseVideo) player.pauseVideo(); }
  function seek(ms) { if (player && player.seekTo) player.seekTo(ms / 1000, true); }
  function rate(r) { if (player && player.setPlaybackRate) player.setPlaybackRate(r); }
  var vol = 100, muted = false;
  function applyVol() { if (!player || !player.setVolume) return; player.setVolume(vol); if (muted) player.mute(); else player.unMute(); }
  function volume(v, m) { vol = v; muted = m; applyVol(); }
  function stopVideo() { if (player && player.stopVideo) player.stopVideo(); }
</script>
</body>
</html>
